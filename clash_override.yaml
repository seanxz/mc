  - RULE-SET,YouTube(By lhie1),📹 YouTube
  - RULE-SET,Netflix(By lhie1),🎥 NETFLIX
  - RULE-SET,Epic,DIRECT
  - RULE-SET,SteamCN,DIRECT
  - RULE-SET,Xbox,DIRECT
  - RULE-SET,抖音,DIRECT
  - RULE-SET,自定义直连,DIRECT
  - RULE-SET,国内域名白名单(By lhie1),DIRECT
  - RULE-SET,国内IP白名单(By lhie1),DIRECT
  - RULE-SET,放行规则-lhie1(建议置顶并直连),DIRECT
